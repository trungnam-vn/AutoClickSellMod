name: Build Auto Fighter AI V2 1.21.3

on:
  push:
    branches:
      - autofighterai-1.21.3-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build and remap JAR
        run: gradle --no-daemon --stacktrace clean build
        working-directory: AutoFighterAI-1.21.3
      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="AutoFighterAI-1.21.3/build/libs/AutoFighterAI-1.21.3-0.4.0.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -E 'fabric.mod.json|AutoFighterAIClient.class'
          unzip -p "$JAR" fabric.mod.json | grep -q '"id": "autofighterai"'
      - uses: actions/upload-artifact@v4
        with:
          name: AutoFighterAI-1.21.3-V2-JAR
          path: AutoFighterAI-1.21.3/build/libs/AutoFighterAI-1.21.3-0.4.0.jar
          if-no-files-found: error
          retention-days: 30
